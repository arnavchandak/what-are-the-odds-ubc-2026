<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Headline Odds</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Headline Odds</h1>
    <div class="header-actions">
      <button id="refresh" class="text-button" type="button" disabled>Refresh</button>
      <button id="settings-button" class="text-button" type="button" aria-controls="settings" aria-expanded="false">Settings</button>
    </div>
  </header>
  <main>
    <form id="settings" hidden>
      <label for="api-key">Claude API key</label>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" required>
      <p class="hint">Your key is stored in this Chrome profile and sent to Anthropic for API authentication. Opening the popup on an uncached page sends an article excerpt to Claude.</p>
      <div class="form-actions">
        <button type="submit">Save key</button>
        <button id="remove-key" class="text-button" type="button" hidden>Remove key</button>
      </div>
    </form>
    <section aria-label="Article markets">
      <p id="status" role="status" aria-live="polite">Loading markets…</p>
      <div id="results"></div>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
